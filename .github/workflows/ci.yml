name: ci

# Typecheck, lint, unit tests and browser E2E on every push to main and every pull request.
# desktop.yml calls the same job before building the installers.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm exec vitest run --reporter=dot --silent
      - run: pnpm test:e2e --reporter=dot
