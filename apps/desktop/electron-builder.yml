appId: app.epd.electrical-plan-designer
productName: Electrical Plan Designer
directories:
  output: release
  buildResources: build
# Main and preload are bundled into out/: nothing from node_modules is packaged.
files:
  - package.json
  - out/**
npmRebuild: false
# Double-clicking a .epd opens it in the app. The document icon (build/epd-document.svg is its
# source; the .icns and .ico are rendered from it) is a page carrying the app icon's glyph.
fileAssociations:
  - ext: epd
    name: Electrical Plan Designer project
    description: Electrical Plan Designer project
    role: Editor
    icon: epd-document
mac:
  icon: build/icon.png
  category: public.app-category.productivity
  # No Developer ID: the app is ad-hoc signed ("-"), because an unsigned arm64 app refuses to
  # launch ("damaged"). Users open it once through Privacy & Security (docs/release.md).
  identity: '-'
  hardenedRuntime: false
  target: [{ target: dmg, arch: [arm64, x64] }]
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
win:
  icon: build/icon.png
  target: [{ target: nsis, arch: [x64] }]
nsis:
  artifactName: ${productName}-${version}-Setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
